<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}POS{% endblock %} · {{ negocio.nombre }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-white shadow sticky top-0 z-40 border-b border-orange-100">
    <div class="max-w-7xl mx-auto px-4 flex flex-wrap items-center justify-between gap-3 py-3">
      <div class="flex items-center">
        <div class="w-10 h-10 rounded-xl bg-orange-600 text-white flex items-center justify-center mr-3">
          <i class="fas fa-screwdriver-wrench"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-900">{{ negocio.nombre }}</h1>
      </div>

      <nav class="flex flex-wrap gap-2 text-sm font-medium">
        {% with actual=request.resolver_match.url_name %}
        <a href="{% url 'pos' %}"
           class="px-3 py-2 rounded-md {% if actual == 'pos' %}bg-orange-600 text-white{% else %}text-gray-600 hover:bg-gray-100{% endif %}">
          <i class="fas fa-cash-register mr-1"></i> Vender
        </a>
        <a href="{% url 'ventas' %}"
           class="px-3 py-2 rounded-md {% if actual == 'ventas' %}bg-orange-600 text-white{% else %}text-gray-600 hover:bg-gray-100{% endif %}">
          <i class="fas fa-list mr-1"></i> Ventas
        </a>
        <a href="{% url 'comprobantes_list' %}"
           class="px-3 py-2 rounded-md {% if actual == 'comprobantes_list' %}bg-orange-600 text-white{% else %}text-gray-600 hover:bg-gray-100{% endif %}">
          <i class="fas fa-file-invoice mr-1"></i> Comprobantes
        </a>
        <a href="{% url 'productos' %}"
           class="px-3 py-2 rounded-md {% if actual == 'productos' %}bg-orange-600 text-white{% else %}text-gray-600 hover:bg-gray-100{% endif %}">
          <i class="fas fa-boxes-stacked mr-1"></i> Productos
        </a>
        {% endwith %}
      </nav>

      <form method="post" action="{% url 'logout' %}" class="flex items-center gap-3 text-sm text-gray-600">
        {% csrf_token %}
        <span><i class="fas fa-user mr-1"></i>{{ user.username }}</span>
        <button type="submit" class="text-gray-500 hover:text-red-600" title="Cerrar sesión">
          <i class="fas fa-sign-out-alt"></i> Salir
        </button>
      </form>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    {% for m in messages %}
    <p class="mb-4 rounded-md px-4 py-2 text-sm
              {% if m.tags == 'error' %}bg-red-50 text-red-700{% else %}bg-green-50 text-green-700{% endif %}">
      {{ m }}
    </p>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>

  {% block extra_js %}{% endblock %}
</body>
</html>
