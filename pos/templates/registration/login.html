<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · {{ negocio.nombre }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <form method="post" class="bg-white rounded-xl shadow-lg p-8 w-full max-w-sm space-y-4">
    {% csrf_token %}
    <div class="text-center">
      <h1 class="text-2xl font-bold text-gray-900">{{ negocio.nombre }}</h1>
      <p class="text-sm text-gray-500">Punto de venta</p>
    </div>

    {% if form.errors %}
    <p class="bg-red-50 text-red-700 text-sm rounded-md px-3 py-2">
      Usuario o contraseña incorrectos.
    </p>
    {% endif %}

    <div>
      <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
      <input id="id_username" name="username" type="text" autofocus required autocomplete="username"
             class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500">
    </div>
    <div>
      <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
      <input id="id_password" name="password" type="password" required autocomplete="current-password"
             class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit"
            class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold rounded-md py-2">
      Ingresar
    </button>
  </form>
</body>
</html>
